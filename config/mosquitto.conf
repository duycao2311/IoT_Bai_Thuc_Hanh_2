# Mosquitto MQTT Broker Configuration
# Bài thực hành 2 - IoT và Ứng dụng

# Listener trên cổng 1883 (MQTT tiêu chuẩn)
listener 1883
protocol mqtt

# Listener WebSocket trên cổng 9001
listener 9001
protocol websockets

# Cho phép kết nối ẩn danh (chỉ dùng trong lab)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Log
log_dest file /mosquitto/log/mosquitto.log
log_type all
